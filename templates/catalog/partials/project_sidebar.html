{% load gitods %}
<aside class="project-side">
  <details class="side-details" open>
    <summary class="side-summary">简介</summary>
    <div class="panel side-panel">
      <p class="side-desc">{{ project.description|default:"—" }}</p>
      <dl class="side-list">
        <div class="side-row"><dt>分组</dt><dd><a href="/explore/?group={{ group.slug }}">{{ group.name }}</a></dd></div>
        {% if project.language %}<div class="side-row"><dt>主语言</dt><dd><span class="lang-dot" style="background: {{ project.language|lang_color }}"></span>{{ project.language }}</dd></div>{% endif %}
        <div class="side-row"><dt>当前分支文件数</dt><dd>{{ file_count }}</dd></div>
        <div class="side-row"><dt>更新时间</dt><dd title="{{ project.updated_at|fulltime }}">{{ project.updated_at|reltime }}</dd></div>
      </dl>
    </div>
  </details>
</aside>
